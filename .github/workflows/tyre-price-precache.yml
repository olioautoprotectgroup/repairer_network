name: Tyre Price Pre-cache

# Refreshes the Databricks price cache for the ~20 common tyre sizes in
# api/src/lib/tyrePrice/config.ts, so a claims handler's search usually hits
# a warm cache instead of a live scrape. Calls the app's own protected
# pre-cache endpoint -- this workflow does no scraping itself.
#
# Static Web Apps' colocated ("managed") Functions support HTTP triggers
# only, not Timer triggers, so this GitHub Actions cron is the scheduler,
# not an Azure Function Timer trigger.
#
# Starts manual-dispatch-only. Uncomment the schedule below once a manual
# run has been verified end-to-end (a real commit/log entry landing,
# reasonable run time) -- same "manual first" discipline this project
# already uses for its Databricks notebooks.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 2 * * *" # 02:00 UTC nightly, once verified

jobs:
  precache:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pre-cache
        run: |
          set -euo pipefail
          response=$(curl -sf -X POST "https://lemon-rock-0b1176203.7.azurestaticapps.net/api/tyre-price/precache" \
            -H "x-precache-key: ${{ secrets.TYRE_PRICE_PRECACHE_KEY }}" \
            --max-time 200)
          echo "$response" | jq .

          # The Databricks token is the single point of failure for this whole
          # feature, and nothing else would tell anyone it had lapsed. Failing
          # this job is the alert: a red nightly run emails someone, a warning
          # buried in a green run does not. Rotating the token clears it.
          status=$(echo "$response" | jq -r '.tokenExpiry.status // "unknown"')
          detail=$(echo "$response" | jq -r '.tokenExpiry.detail // "no detail"')
          case "$status" in
            expired|expiring)
              echo "::error::$detail"
              exit 1
              ;;
            unknown)
              # Not alarming: listing tokens is a separate permission from
              # using the warehouse, so this is often just a 403 and says
              # nothing about whether the sync itself is working.
              echo "::notice::Token expiry not checked -- $detail"
              ;;
            *)
              echo "Token expiry OK -- $detail"
              ;;
          esac
