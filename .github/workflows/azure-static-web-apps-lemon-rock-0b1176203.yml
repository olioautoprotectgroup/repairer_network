name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# The nightly Databricks chain pushes two commits seconds apart (the intake
# merge adds a repairer, then the repair-count sync). Both deploys then race,
# and Azure cancels one of them server-side by upload order rather than commit
# order -- so the OLDER commit can win and the newer one silently never goes
# live. That is exactly what happened on 2026-09-03 (run #95, commit 459e7e4).
# Serialising here makes the outcome deterministic: a newer push cancels the
# older in-flight run, and the newer checkout already contains the older
# commit, so nothing is lost. Grouped by ref so PR previews stay independent.
#
# Keyed on the event as well as the ref, because ref alone let a PR-close
# run cancel a production deploy. Merging PR #1 queued both at the same
# second -- the push to main (the real deploy) and the pull_request
# "closed" run -- and the push run was cancelled one second in, before any
# step ran, so the merge never went live. Nothing else in this repo cancels
# runs, and GitHub records no reason for a cancellation, so this is the
# cause by elimination rather than from a log. Including the event name
# keeps pushes and PR runs in separate groups whatever GitHub resolves
# github.ref to for a closed PR, which is the part that wasn't obvious:
# refs/heads/main vs refs/pull/N/merge *should* already have separated
# them.
#
# The original intent is unchanged: a newer push to a ref still cancels the
# older in-flight run for that same ref, and PR previews stay independent
# of main.
concurrency:
  group: swa-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_ROCK_0B1176203 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Required even to tear a preview environment down: without it the
          # action stops at "deployment_token was not provided" and the job
          # fails. Missing since this workflow was generated, but PR #1 was
          # this repo's first pull request, so this job had never run before
          # -- on a push to main it's skipped by the `if` above.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_ROCK_0B1176203 }}
          action: "close"
