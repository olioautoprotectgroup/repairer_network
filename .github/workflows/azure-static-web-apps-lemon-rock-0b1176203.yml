name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    # No `closed` -- with close_pull_request_job removed (see below) a
    # closed PR would start a run whose only job is skipped, and it was
    # exactly that second run, racing the merge's push, that cancelled the
    # production deploy when PR #1 merged.
    types: [opened, synchronize, reopened]
    branches:
      - main

# The nightly Databricks chain pushes two commits seconds apart (the intake
# merge adds a repairer, then the repair-count sync). Both deploys then race,
# and Azure cancels one of them server-side by upload order rather than commit
# order -- so the OLDER commit can win and the newer one silently never goes
# live. That is exactly what happened on 2026-09-03 (run #95, commit 459e7e4).
# Serialising here makes the outcome deterministic: a newer push cancels the
# older in-flight run, and the newer checkout already contains the older
# commit, so nothing is lost. Grouped by ref so PR previews stay independent.
#
# Keyed on the event as well as the ref, because ref alone let a PR-close
# run cancel a production deploy. Merging PR #1 queued both at the same
# second -- the push to main (the real deploy) and the pull_request
# "closed" run -- and the push run was cancelled one second in, before any
# step ran, so the merge never went live. Nothing else in this repo cancels
# runs, and GitHub records no reason for a cancellation, so this is the
# cause by elimination rather than from a log. Including the event name
# keeps pushes and PR runs in separate groups whatever GitHub resolves
# github.ref to for a closed PR, which is the part that wasn't obvious:
# refs/heads/main vs refs/pull/N/merge *should* already have separated
# them.
#
# The original intent is unchanged: a newer push to a ref still cancels the
# older in-flight run for that same ref, and PR previews stay independent
# of main.
concurrency:
  group: swa-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_ROCK_0B1176203 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

# There is deliberately no close_pull_request_job. Azure's generated
# workflow includes one, which tears the PR's preview environment down on
# close, but it cannot succeed against this app: with the deployment token
# missing (as generated) it fails on "deployment_token was not provided",
# and with the token supplied it fails on the content server's
# "BadRequest -- No matching static site found" instead. Both were observed
# here, on PR #1 and PR #2 respectively. That second error is an open
# upstream issue with no maintainer response and no known fix
# (Azure/static-web-apps#1638); its reporter tried regenerating the token
# and adding repo_token, neither of which helped, so there was no fix left
# to try that wasn't a guess.
#
# Removed rather than left failing or marked continue-on-error: a job that
# can never go green trains everyone to ignore a red run on this workflow,
# which is the opposite of what the red is for here (see 6abc325, where a
# run is deliberately failed so a lapsing token can't pass unnoticed).
#
# The cost is that preview environments are not cleaned up automatically --
# delete them under Environments in the Static Web App in the Azure portal.
# The Free tier caps how many can exist at once, so leaving them to
# accumulate will eventually start failing PR preview deploys. Restoring
# this job is the right move if the upstream issue is ever fixed.
